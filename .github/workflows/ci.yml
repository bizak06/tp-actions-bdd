name: CI - Tests multi-langages

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        working-directory: python-app
        run: pip install -r requirements.txt

      - name: Lancer les tests
        working-directory: python-app
        run: pytest -v

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node-app/package-lock.json

      - name: Installer les dépendances
        working-directory: node-app
        run: npm ci

      - name: Lancer les tests
        working-directory: node-app
        run: npm test

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compiler et tester
        working-directory: java-app
        run: mvn -B package

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql

      - name: Installer les dépendances
        working-directory: php-app
        run: composer install --no-interaction

      - name: Lancer les tests
        working-directory: php-app
        run: vendor/bin/phpunit tests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [python, node, java, php]
    steps:
      - name: Build
        run: echo "Tous les tests sont verts : build validé."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Déploiement
        run: |
          echo "Déploiement en cours..."
          test -n "$TOKEN" && echo "Token présent" || (echo "Secret DEPLOY_TOKEN manquant" && exit 1)
